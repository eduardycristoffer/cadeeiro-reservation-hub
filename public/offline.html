<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sem conexão — Candeeiro</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f7; --fg:#1d1d1f; --muted:#6e6e73; --card:#fff; --brand:#d9201f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --muted:#a1a1a6; --card:#161618; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { width:100%; max-width:380px; text-align:center; background:var(--card); border-radius:28px; padding:32px 24px; box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -16px rgba(0,0,0,.18); }
  img { width:72px; height:72px; border-radius:18px; }
  h1 { margin:18px 0 6px; font-size:22px; line-height:1.2; }
  p { margin:0; color:var(--muted); font-size:15px; }
  button { margin-top:24px; min-height:52px; width:100%; border:0; border-radius:16px; background:var(--brand); color:#fff; font:600 16px inherit; font-family:inherit; cursor:pointer; }
  button:active { opacity:.85; }
  .st { margin-top:14px; font-size:13px; min-height:20px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="72" height="72">
  <h1>Sem conexão</h1>
  <p>Não deu para falar com o servidor. Confira o Wi-Fi ou o 4G e tente de novo. O que você já tinha aberto continua no aparelho.</p>
  <button type="button" id="retry">Tentar de novo</button>
  <p class="st" id="st" role="status" aria-live="polite"></p>
</main>
<script>
  var st = document.getElementById("st");
  function tentar() {
    st.textContent = "Tentando…";
    fetch("/favicon.png?t=" + Date.now(), { cache: "no-store" }).then(function () { location.reload(); }, function () { st.textContent = "Ainda sem conexão."; });
  }
  document.getElementById("retry").addEventListener("click", tentar);
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
